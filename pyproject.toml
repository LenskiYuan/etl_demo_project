[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-workflow-observability-demo"
version = "0.1.0"
description = "Synthetic ETL and observability demo for medical AI workflows"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
