services:
  postgres:
    image: postgres:16
    container_name: medical-ai-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_ai_demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo_user} -d ${POSTGRES_DB:-medical_ai_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: medical-ai-demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: medical-ai-demo-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-demo_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-demo_password}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    container_name: medical-ai-demo-api
    environment:
      APP_NAME: Medical AI Workflow Demo API
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo_user}:${POSTGRES_PASSWORD:-demo_password}@postgres:5432/${POSTGRES_DB:-medical_ai_demo}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN: http://localhost:5173
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: etl-demo
      KEYCLOAK_CLIENT_ID: etl-frontend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: medical-ai-demo-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo_user}:${POSTGRES_PASSWORD:-demo_password}@postgres:5432/${POSTGRES_DB:-medical_ai_demo}
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: etl-demo
      KEYCLOAK_CLIENT_ID: etl-frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medical-ai-demo-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: etl-demo
      VITE_KEYCLOAK_CLIENT_ID: etl-frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
