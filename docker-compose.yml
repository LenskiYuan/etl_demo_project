services:
  postgres:
    image: postgres:16
    container_name: medical-ai-demo-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d/schema:ro

volumes:
  postgres_data:
